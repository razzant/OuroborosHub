name: Validate Catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      suites: ${{ steps.prepare.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML pytest
      - name: Select affected suites and refresh legacy publishers' entries
        id: prepare
        run: python -B scripts/ci_checks.py
      # Entries are canonical. Owner updates may omit the generated v1 file;
      # Sync Joi Lab Mirror publishes it from merged main before mirroring.
      - run: python scripts/build_index.py
      - run: python scripts/build_index.py --check
      - run: >-
          python -B -m pytest -p no:cacheprovider -q
          tests/test_catalog.py tests/test_index.py tests/test_owner_updates.py
          tests/test_signals.py tests/test_workflows.py tests/test_ci_checks.py
      - name: Record owner-update eligibility without secrets
        if: github.event_name == 'pull_request'
        run: python -B scripts/owner_updates.py verdict --output "$RUNNER_TEMP/owner-verdict/verdict.json"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: owner-update-verdict
          overwrite: true
          path: ${{ runner.temp }}/owner-verdict/verdict.json
          if-no-files-found: error
          retention-days: 3

  hosted-skills:
    needs: catalog
    if: needs.catalog.outputs.suites != '[]'
    name: ${{ matrix.suite }}
    # memory-atlas drives its card in a real host with Chromium and WebKit as macOS runs them, on the core's Python.
    runs-on: ${{ matrix.suite == 'memory-atlas' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: ${{ contains(fromJSON('["memory-atlas", "calendar-skill", "email-presence"]'), matrix.suite) && 30 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.catalog.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ contains(fromJSON('["memory-atlas", "calendar-skill", "email-presence"]'), matrix.suite) && '3.10' || '3.11' }}
      - run: python -m pip install PyYAML
      # The core Memory Atlas reads memory through (PluginAPI 2.1 read_memory): razzant/ouroboros at the merge of its
      # PR 2426. Its runtime lock brings Playwright. Without the core or a browser the suite fails; it never skips.
      - name: Check out the pinned core for memory-atlas
        if: matrix.suite == 'memory-atlas'
        uses: actions/checkout@v4
        with:
          repository: razzant/ouroboros
          ref: 4d55f05d2a67c4678de0cd0d82c685c2c33fe4d7
          path: atlas-core
          persist-credentials: false
      - name: Install that core's runtime and the browsers, and name the core
        if: matrix.suite == 'memory-atlas'
        run: |
          python -m pip install -r atlas-core/requirements.txt
          python -m playwright install chromium webkit
          echo "ATLAS_CORE=$GITHUB_WORKSPACE/atlas-core" >> "$GITHUB_ENV"
      # Mail and Calendar exercise the actual Host Service, child tool dispatcher, opaque widgets and sign-in return.
      # This exact core contains their coordinated seam; provider edges remain offline fixtures.
      - name: Check out the pinned core for mail and calendar
        if: matrix.suite == 'email-presence' || matrix.suite == 'calendar-skill'
        uses: actions/checkout@v4
        with:
          repository: razzant/ouroboros
          ref: 9c4411457bdb752d9379f17a97cf171a22384402
          path: mail-calendar-core
          persist-credentials: false
      - name: Install the mail and calendar consumer runtime
        if: matrix.suite == 'email-presence' || matrix.suite == 'calendar-skill'
        run: |
          python -m pip install -r mail-calendar-core/requirements.txt
          python -m playwright install --with-deps chromium webkit
          echo "OUROBOROS_SOURCE_DIR=$GITHUB_WORKSPACE/mail-calendar-core" >> "$GITHUB_ENV"
          echo "OUROBOROS_THEME_CORE_ROOT=$GITHUB_WORKSPACE/mail-calendar-core" >> "$GITHUB_ENV"
      - name: Run the selected hosted suite with its runtime dependencies
        env:
          SUITE: ${{ matrix.suite }}
        run: python -B scripts/ci_checks.py run "$SUITE"

  checks:
    needs: [catalog, hosted-skills]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected suite to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          results = [job['result'] for job in json.loads(os.environ['NEEDS']).values()]
          sys.exit(0 if all(result in {'success', 'skipped'} for result in results) else 1)
          PY

name: Validate Catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      suites: ${{ steps.prepare.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML pytest
      - name: Select affected suites and refresh legacy publishers' entries
        id: prepare
        run: python -B scripts/ci_checks.py
      # Entries are canonical. Owner updates may omit the generated v1 file;
      # Sync Joi Lab Mirror publishes it from merged main before mirroring.
      - run: python scripts/build_index.py
      - run: python scripts/build_index.py --check
      - run: >-
          python -B -m pytest -p no:cacheprovider -q
          tests/test_catalog.py tests/test_index.py tests/test_owner_updates.py
          tests/test_signals.py tests/test_workflows.py tests/test_ci_checks.py
      - name: Record owner-update eligibility without secrets
        if: github.event_name == 'pull_request'
        run: python -B scripts/owner_updates.py verdict --output "$RUNNER_TEMP/owner-verdict/verdict.json"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: owner-update-verdict
          overwrite: true
          path: ${{ runner.temp }}/owner-verdict/verdict.json
          if-no-files-found: error
          retention-days: 3

  hosted-skills:
    needs: catalog
    if: needs.catalog.outputs.suites != '[]'
    name: ${{ matrix.suite }}
    # memory-atlas drives its card in a real host with Chromium and WebKit as macOS runs them, on the core's Python.
    runs-on: ${{ matrix.suite == 'memory-atlas' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: ${{ contains(fromJSON('["memory-atlas", "calendar-skill", "email-presence"]'), matrix.suite) && 30 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.catalog.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ contains(fromJSON('["memory-atlas", "calendar-skill", "email-presence"]'), matrix.suite) && '3.10' || '3.11' }}
      - run: python -m pip install PyYAML
      # The core Memory Atlas reads memory through (PluginAPI 2.1 read_memory): razzant/ouroboros at the merge of its
      # PR 2426. Its runtime lock brings Playwright. Without the core or a browser the suite fails; it never skips.
      - name: Check out the pinned core for memory-atlas
        if: matrix.suite == 'memory-atlas'
        uses: actions/checkout@v4
        with:
          repository: razzant/ouroboros
          ref: 4d55f05d2a67c4678de0cd0d82c685c2c33fe4d7
          path: atlas-core
          persist-credentials: false
      - name: Install that core's runtime and the browsers, and name the core
        if: matrix.suite == 'memory-atlas'
        run: |
          python -m pip install -r atlas-core/requirements.txt
          python -m playwright install chromium webkit
          echo "ATLAS_CORE=$GITHUB_WORKSPACE/atlas-core" >> "$GITHUB_ENV"
      # Mail and Calendar exercise the actual Host Service, child tool dispatcher, opaque widgets and sign-in return.
      # This exact core contains their coordinated seam; provider edges remain offline fixtures.
      - name: Check out the pinned core for mail and calendar
        if: matrix.suite == 'email-presence' || matrix.suite == 'calendar-skill'
        uses: actions/checkout@v4
        with:
          repository: razzant/ouroboros
          ref: 9c4411457bdb752d9379f17a97cf171a22384402
          path: mail-calendar-core
          persist-credentials: false
      - name: Install the mail and calendar consumer runtime
        if: matrix.suite == 'email-presence' || matrix.suite == 'calendar-skill'
        run: |
          python -m pip install -r mail-calendar-core/requirements.txt
          python -m playwright install --with-deps chromium webkit
          echo "OUROBOROS_SOURCE_DIR=$GITHUB_WORKSPACE/mail-calendar-core" >> "$GITHUB_ENV"
          echo "OUROBOROS_THEME_CORE_ROOT=$GITHUB_WORKSPACE/mail-calendar-core" >> "$GITHUB_ENV"
      # The Presence consumers (tests/test_*_core_consumer.py) drive Slack and Telegram through this core's own Presence
      # routes in child processes. They import nothing beyond each suite's dependencies, so the checkout is all they
      # need. Without it the suite fails; they never skip.
      - name: Check out the pinned core for the Presence consumers
        if: contains(fromJSON('["freshdesk", "slack-bridge", "telegram-bot", "telegram-user-session"]'), matrix.suite)
        uses: actions/checkout@v4
        with:
          repository: razzant/ouroboros
          ref: 9f6fe2f5f7f4d8f3e5ea58f0d04fb352181416bc
          path: presence-core
          persist-credentials: false
      - name: Name that core for the Presence consumers
        if: contains(fromJSON('["freshdesk", "slack-bridge", "telegram-bot", "telegram-user-session"]'), matrix.suite)
        run: echo "OUROBOROS_PRESENCE_CORE_ROOT=$GITHUB_WORKSPACE/presence-core" >> "$GITHUB_ENV"
      # The phone line's bridge tests drive this core's real live-call doors (LiveCallHub, the peer socket pump) and parse its
      # Presence event with the core's own parser (parse_presence_event, PluginAPI 2.4), which the Presence consumers' core above
      # predates. The tests import nothing beyond the suite's dependencies, so the checkout is all they need. Without it the
      # suite fails; its core pins never skip (TELEPHONY_REQUIRE_CORE in scripts/ci_checks.py).
      - name: Check out the pinned core for telephony
        if: matrix.suite == 'telephony'
        uses: actions/checkout@v4
        with:
          repository: razzant/ouroboros
          ref: 33eb58b4fbca849328426cfcd7a64e054f923741
          path: telephony-core
          persist-credentials: false
      - name: Name that core for telephony
        if: matrix.suite == 'telephony'
        run: echo "TELEPHONY_CORE_REPO=$GITHUB_WORKSPACE/telephony-core" >> "$GITHUB_ENV"
      # The Chrome adapter's tests are Node's own. They need Node and the exact npm closure skills/chrome_browser/pins.json
      # records; the version is read from that file, and the tests verify every pinned file by hash. A different closure
      # fails them; they never skip.
      - uses: actions/setup-node@v4
        if: matrix.suite == 'chrome-browser'
        with:
          node-version: '24'
      - name: Install the npm closure that chrome_browser pins
        if: matrix.suite == 'chrome-browser'
        run: |
          mkdir -p "$RUNNER_TEMP/chrome-browser-npm"
          version=$(python -c "import json; print(json.load(open('skills/chrome_browser/pins.json'))['npm']['@playwright/mcp']['version'])")
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/chrome-browser-npm" "@playwright/mcp@$version"
          echo "OUROBOROS_CHROME_NODE_MODULES=$RUNNER_TEMP/chrome-browser-npm/node_modules" >> "$GITHUB_ENV"
      # The quota widget's Node harnesses and real-browser cases: Node and Playwright's Chromium and WebKit. Without them
      # its tests fail (QUOTAS_REQUIRE_RUNTIME in scripts/ci_checks.py); they never skip.
      - uses: actions/setup-node@v4
        if: matrix.suite == 'claudexor-quotas' || matrix.suite == 'cache-efficiency'
        with:
          node-version: '24'
      - name: Install Playwright and its browsers for claudexor-quotas
        if: matrix.suite == 'claudexor-quotas'
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium webkit
      - name: Install the token dashboard's real browser consumers
        if: matrix.suite == 'cache-efficiency'
        run: |
          python -m pip install 'playwright==1.62.0'
          python -m playwright install --with-deps chromium webkit
      - name: Run the selected hosted suite with its runtime dependencies
        env:
          SUITE: ${{ matrix.suite }}
        run: python -B scripts/ci_checks.py run "$SUITE"

  checks:
    needs: [catalog, hosted-skills]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected suite to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          results = [job['result'] for job in json.loads(os.environ['NEEDS']).values()]
          sys.exit(0 if all(result in {'success', 'skipped'} for result in results) else 1)
          PY

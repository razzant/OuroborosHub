name: Validate Catalog

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review starts a fresh validation after a maintainer releases a hold.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# The one razzant/ouroboros commit every hosted suite that needs a core runs against (README, Tests and widgets).
# Declared only here (tests/test_workflows.py fails on a second pin). Move it with a PR that changes only this value:
# this file is shared, so that PR selects every suite, and it merges when all of them pass on the new core.
env:
  OUROBOROS_CORE_SHA: d945f07d341d8c43b319e35af09d8fea3704f762

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      suites: ${{ steps.prepare.outputs.suites }}
    steps:
      # Every job checks out the one commit this run tests (for a PR, GitHub's merge of head into main).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML pytest
      - name: Select affected suites and refresh legacy publishers' entries
        id: prepare
        run: python -B scripts/ci_checks.py
      # Entries are canonical. Owner updates may omit the generated v1 file;
      # Sync Joi Lab Mirror publishes it from merged main before mirroring.
      - run: python scripts/build_index.py
      - run: python scripts/build_index.py --check
      # tests/test_index.py compares every hosted release and connector with the pinned core
      # (OUROBOROS_IDENTITY_CORE_ROOT). It imports the core's modules only, so none of its runtime is installed.
      - name: Check out the pinned core
        uses: actions/checkout@v4
        with:
          repository: razzant/ouroboros
          ref: ${{ env.OUROBOROS_CORE_SHA }}
          path: core
          persist-credentials: false
      - env:
          OUROBOROS_IDENTITY_CORE_ROOT: ${{ github.workspace }}/core
        run: >-
          python -B -m pytest -p no:cacheprovider -q
          tests/test_catalog.py tests/test_index.py tests/test_owner_updates.py
          tests/test_signals.py tests/test_workflows.py tests/test_ci_checks.py

  hosted-skills:
    needs: catalog
    if: needs.catalog.outputs.suites != '[]'
    # Owner Updates requires a passed job of this name in the same attempt for each suite the change selects.
    name: ${{ matrix.suite }}
    # memory-atlas drives its card in a real host with Chromium and WebKit as macOS runs them.
    runs-on: ${{ matrix.suite == 'memory-atlas' && 'macos-latest' || 'ubuntu-latest' }}
    # The suites that install the core's runtime and drive browsers get 30 minutes.
    timeout-minutes: ${{ contains(fromJSON('["memory-atlas", "calendar-skill", "email-presence", "smart-lists", "telegram-user-session", "widgets"]'), matrix.suite) && 30 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.catalog.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          # memory-atlas, calendar-skill and email-presence keep 3.10, the Python they were qualified on and still the
          # oldest one the core runs on (apps up to 7.11.0 keep it across Update); the other suites use 3.11.
          python-version: ${{ contains(fromJSON('["memory-atlas", "calendar-skill", "email-presence"]'), matrix.suite) && '3.10' || '3.11' }}
      - run: python -m pip install PyYAML
      # Every suite whose tests use a real core (core_env in scripts/ci_checks.py) checks out that one commit,
      # OUROBOROS_CORE_SHA above. Without it those suites fail; their real-core tests never skip. The widgets suite
      # also reads the core's historical theme bridge with git show, so its checkout carries the history (about 130 MB).
      - name: Check out the pinned core
        if: contains(fromJSON('["calendar-skill", "email-presence", "freshdesk", "github", "memory-atlas", "slack-bridge", "smart-lists", "telegram-bot", "telegram-user-session", "widgets"]'), matrix.suite)
        uses: actions/checkout@v4
        with:
          repository: razzant/ouroboros
          ref: ${{ env.OUROBOROS_CORE_SHA }}
          path: core
          persist-credentials: false
          fetch-depth: ${{ matrix.suite == 'widgets' && '0' || '1' }}
      # Memory Atlas starts that core's server and reads through PluginAPI 2.1 read_memory and its transfer contract.
      # Mail and Calendar exercise its Host Service, child tool dispatcher, opaque widgets and sign-in return; provider
      # edges remain offline fixtures. Smart Lists, the Telegram participant widget and the dashboard cards (widgets)
      # mount through the core's module bridge; Smart Lists also checks its widget declarations with the core's
      # validator (OUROBOROS_CORE_ROOT). They need the core's runtime (it supplies Playwright) and Chromium and WebKit;
      # Linux runners also need the browsers' libraries.
      - name: Install the core's runtime and the browsers, and name the core
        if: contains(fromJSON('["calendar-skill", "email-presence", "memory-atlas", "smart-lists", "telegram-user-session", "widgets"]'), matrix.suite)
        run: |
          python -m pip install -r core/requirements.txt
          if [ "$RUNNER_OS" = Linux ]; then
            python -m playwright install --with-deps chromium webkit
          else
            python -m playwright install chromium webkit
          fi
          echo "ATLAS_CORE=$GITHUB_WORKSPACE/core" >> "$GITHUB_ENV"
          echo "OUROBOROS_SOURCE_DIR=$GITHUB_WORKSPACE/core" >> "$GITHUB_ENV"
          echo "OUROBOROS_THEME_CORE_ROOT=$GITHUB_WORKSPACE/core" >> "$GITHUB_ENV"
          echo "OUROBOROS_CORE_ROOT=$GITHUB_WORKSPACE/core" >> "$GITHUB_ENV"
      # The Presence consumers (tests/test_*_core_consumer.py) drive Slack and Telegram through the core's own Presence
      # routes in child processes, and GitHub's owner-account contract runs through its places module. They import
      # nothing beyond each suite's dependencies, so the checkout is all they need; scripts/ci_checks.py puts it last
      # on the tests' import path and stops a bridge suite whose core lacks a check its tests import (core_imports).
      - name: Name the core for the Presence consumers and GitHub
        if: contains(fromJSON('["freshdesk", "github", "slack-bridge", "telegram-bot", "telegram-user-session"]'), matrix.suite)
        run: |
          echo "OUROBOROS_PRESENCE_CORE_ROOT=$GITHUB_WORKSPACE/core" >> "$GITHUB_ENV"
          echo "OUROBOROS_IDENTITY_CORE_ROOT=$GITHUB_WORKSPACE/core" >> "$GITHUB_ENV"
      # The Chrome adapter's tests are Node's own. They need Node and the exact npm closure skills/chrome_browser/pins.json
      # records; the version is read from that file, and the tests verify every pinned file by hash. A different closure
      # fails them; they never skip. memory-atlas's formatter tests (test_transfer_words.py) need Node 20 or newer too.
      - uses: actions/setup-node@v4
        if: matrix.suite == 'chrome-browser' || matrix.suite == 'memory-atlas'
        with:
          node-version: '24'
      - name: Install the npm closure that chrome_browser pins
        if: matrix.suite == 'chrome-browser'
        run: |
          mkdir -p "$RUNNER_TEMP/chrome-browser-npm"
          version=$(python -c "import json; print(json.load(open('skills/chrome_browser/pins.json'))['npm']['@playwright/mcp']['version'])")
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/chrome-browser-npm" "@playwright/mcp@$version"
          echo "OUROBOROS_CHROME_NODE_MODULES=$RUNNER_TEMP/chrome-browser-npm/node_modules" >> "$GITHUB_ENV"
      # The quota widget's Node harnesses and real-browser cases: Node and Playwright's Chromium and WebKit. Without them
      # its tests fail (QUOTAS_REQUIRE_RUNTIME in scripts/ci_checks.py); they never skip.
      - uses: actions/setup-node@v4
        if: matrix.suite == 'claudexor-quotas' || matrix.suite == 'cache-efficiency'
        with:
          node-version: '24'
      - name: Install Playwright and its browsers for claudexor-quotas
        if: matrix.suite == 'claudexor-quotas'
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium webkit
      - name: Install the token dashboard's real browser consumers
        if: matrix.suite == 'cache-efficiency'
        run: |
          python -m pip install 'playwright==1.62.0'
          python -m playwright install --with-deps chromium webkit
      # Anime Studio's assembly cases encode synthetic clips with the real ffmpeg (libx264 and aac); the runner image
      # has none. Without it the suite stops with an error (ffmpeg_encoders in scripts/ci_checks.py); they never skip.
      - name: Install ffmpeg for anime-studio's assembly cases
        if: matrix.suite == 'anime-studio'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Run the selected hosted suite with its runtime dependencies
        env:
          SUITE: ${{ matrix.suite }}
        run: python -B scripts/ci_checks.py run "$SUITE"

  checks:
    needs: [catalog, hosted-skills]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected suite to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          results = [job['result'] for job in json.loads(os.environ['NEEDS']).values()]
          sys.exit(0 if all(result in {'success', 'skipped'} for result in results) else 1)
          PY

  # Attests this run attempt from GitHub's own contexts on a fresh runner after every check passed. It checks out
  # and executes no repository file. Owner Updates verifies the named commits itself; the receipt grants nothing.
  receipt:
    needs: checks
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.checks.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record the commit this run attempt tested
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TESTED_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          python3 -I - <<'PY'
          import json, os, pathlib
          env = os.environ
          path = pathlib.Path(env['RUNNER_TEMP'], 'owner-receipt', 'receipt.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          receipt = {'schema_version': 1, 'repository': env['GITHUB_REPOSITORY'],
                     'run_id': int(env['GITHUB_RUN_ID']), 'run_attempt': int(env['GITHUB_RUN_ATTEMPT']),
                     'pr_number': int(env['PR_NUMBER']), 'head_sha': env['HEAD_SHA'], 'tested_sha': env['TESTED_SHA'],
                     'workflow_ref': env['WORKFLOW_REF'], 'workflow_sha': env['WORKFLOW_SHA']}
          path.write_text(json.dumps(receipt, sort_keys=True) + '\n', encoding='utf-8')
          PY
      # One artifact per attempt; an existing name fails the upload instead of being replaced.
      - uses: actions/upload-artifact@v4
        with:
          name: owner-update-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/owner-receipt/receipt.json
          overwrite: false
          if-no-files-found: error
          retention-days: 3

name: Validate Catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML pytest
      - run: python -m unittest discover -s tests -v
      - run: python -B skills/gigasearch/test_gigasearch.py -v
      - run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider -q skills/cache_efficiency_snapshot/test_cache_efficiency.py
      - run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider -q tests/test_widget_theme_contracts.py
      - run: python scripts/build_catalog.py --check

  telegram-user-session-offline:
    # Source-only tests live outside skills/: they must not become an installed
    # payload or change its reviewed catalog hash. No Telegram credentials.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest telethon==1.45.0
      - name: Check user-session protocol and custody without a Telegram account
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider -q -rs tests/telegram_user_session

  transport-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest httpx starlette websockets
      - name: Check registered schemas and offline transport behavior
        # Provider HTTP calls are mocked. Two optional Host-contract probes skip
        # without a local Ouroboros checkout; no live core or credentials are used.
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider -q -rs skills/slack-bridge/tests skills/telegram-bot/tests

# Temporary qualification branch ONLY. Do not merge this replacement into main.
name: Memory transfer qualification
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Full qualification or the addressed frames repeat plus N3 observation
        type: choice
        default: full
        options: [full, frames-only]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  qualify:
    if: startsWith(github.ref, 'refs/heads/qa/memory-transfer-')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UV_PYTHON_DOWNLOADS: never
      QA_PHASE: ${{ inputs.phase }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: qa-hub
          persist-credentials: false
          fetch-depth: 1
      - name: Keep Hub separate from the core checkout
        run: |
          mv "$GITHUB_WORKSPACE/qa-hub" "$RUNNER_TEMP/hub"
          mkdir -p "$RUNNER_TEMP/evidence"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/browsers" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: razzant/ouroboros
          ref: 42aab559faca79bac21bf7630a82ac9fb9667702
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bind sources and prepare a mechanical composition
        id: sources
        run: python3 -I -B "$RUNNER_TEMP/hub/qa/qualify.py" prepare
      # This action runs from the core root, as its relative paths require.
      - name: Core's shipped Python 3.10.22 and locked dependency-only environment
        id: runtime
        uses: ./.github/actions/setup-python-env
        with:
          interpreter: shipped
          install-project: 'false'
      - name: Use the environment activated by the core action
        run: echo "UV_PROJECT_ENVIRONMENT=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
      - name: Install locked Chromium and WebKit
        id: browsers
        run: |
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m playwright install --with-deps chromium webkit 2>&1 | tee "$RUNNER_TEMP/evidence/browser-install.log"
      - name: Execute core, Atlas, compatibility and negative witnesses
        id: qualification
        if: ${{ success() && inputs.phase == 'full' }}
        run: |
          "$UV_PROJECT_ENVIRONMENT/bin/python" -I -B "$RUNNER_TEMP/hub/qa/qualify.py" run
      - name: Only the complete four-cell frames matrix
        id: frames
        if: ${{ success() && inputs.phase == 'frames-only' }}
        run: '"$UV_PROJECT_ENVIRONMENT/bin/python" -I -B "$RUNNER_TEMP/hub/qa/qualify.py" frames-only'
      - uses: actions/setup-python@v5
        if: ${{ !cancelled() && (steps.qualification.outputs.comparison_ready == 'true' || (inputs.phase == 'frames-only' && steps.sources.outcome == 'success' && steps.runtime.outcome == 'success')) }}
        id: comparison_python
        with:
          python-version: '3.12.13'
      - name: Only the legacy datetime reader comparison
        if: ${{ !cancelled() && steps.qualification.outputs.comparison_ready == 'true' && steps.comparison_python.outcome == 'success' }}
        id: comparison
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/python312
          COMPARISON_PYTHON: ${{ steps.comparison_python.outputs.python-path }}
        run: |
          uv sync --locked --python "$COMPARISON_PYTHON" --extra browser --group dev --no-install-project 2>&1 | tee "$RUNNER_TEMP/evidence/setup312.log"
          "$UV_PROJECT_ENVIRONMENT/bin/python" -I -B "$RUNNER_TEMP/hub/qa/qualify.py" compare
      - name: N3 historical C1 writer on 3.12 (independent of frames outcome)
        id: n3_writer
        if: ${{ !cancelled() && inputs.phase == 'frames-only' && steps.sources.outcome == 'success' && steps.runtime.outcome == 'success' && steps.comparison_python.outcome == 'success' }}
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/python312
          COMPARISON_PYTHON: ${{ steps.comparison_python.outputs.python-path }}
        run: |
          uv sync --locked --python "$COMPARISON_PYTHON" --extra browser --group dev --no-install-project 2>&1 | tee "$RUNNER_TEMP/evidence/setup312.log"
          "$UV_PROJECT_ENVIRONMENT/bin/python" -I -B "$RUNNER_TEMP/hub/qa/qualify.py" n3-write
      - name: N3 cross-version replay and full/F3 observation on shipped 3.10
        if: ${{ !cancelled() && inputs.phase == 'frames-only' && steps.n3_writer.outcome == 'success' }}
        run: '"$GITHUB_WORKSPACE/.venv/bin/python" -I -B "$RUNNER_TEMP/hub/qa/qualify.py" n3-read'
      - name: Preserve sources, synthetic state and outcomes on either result
        if: always()
        env:
          PREPARE_OUTCOME: ${{ steps.sources.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          BROWSER_OUTCOME: ${{ steps.browsers.outcome }}
          COMPARISON_SETUP_OUTCOME: ${{ steps.comparison_python.outcome }}
        run: python3 -I -B "$RUNNER_TEMP/hub/qa/qualify.py" export
      - name: Upload small outcomes, logs and visual evidence first
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-transfer-small-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/evidence/*.json
            ${{ runner.temp }}/evidence/*.stdout
            ${{ runner.temp }}/evidence/*.stderr
            ${{ runner.temp }}/evidence/*.xml
            ${{ runner.temp }}/evidence/*.txt
            ${{ runner.temp }}/evidence/*.log
            ${{ runner.temp }}/evidence/**/*.png
            ${{ runner.temp }}/evidence/**/*.html
            ${{ runner.temp }}/evidence/visual/**/*.json
            ${{ runner.temp }}/evidence/visual/**/*.txt
            ${{ runner.temp }}/evidence/visual/**/*.jsonl
            ${{ runner.temp }}/evidence/visual/**/*.bin
            ${{ runner.temp }}/evidence/n3/*.json
            ${{ runner.temp }}/evidence/n3/*.txt
            ${{ runner.temp }}/evidence/n3/*.py
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload full retained archive separately
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-transfer-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

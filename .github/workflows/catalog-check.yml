# Temporary manual QA for original SSH Workspace PR316.
# This replacement belongs only to the temporary QA branch.
name: SSH Workspace QA (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-workspace-qa:
    if: >-
      github.repository == 'razzant/OuroborosHub' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare evidence before checkout
        shell: bash
        run: |
          qa_dir="$(mktemp -d "${RUNNER_TEMP}/q.XXXXXX")"
          printf 'QA_DIR=%s\n' "$qa_dir" >> "$GITHUB_ENV"
          mkdir "$qa_dir/evidence"
          printf 'phase=preparation\nrepository=%s\nsha=%s\nrun=%s\nattempt=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT" > "$qa_dir/evidence/preparation.txt"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check out pinned public baseline
        uses: actions/checkout@v4
        with:
          repository: MatthewMih/ouroboros-ssh-workspace
          ref: cd918c577c440793aaa10883b47dda2819cc99c9
          path: qa/ssh-workspace-316/payload-old
          persist-credentials: false

      - name: Check out pinned public candidate
        uses: actions/checkout@v4
        with:
          repository: MatthewMih/ouroboros-ssh-workspace
          ref: 851db70d4cf03d31f65d1b6762c84c3bacb636ef
          path: qa/ssh-workspace-316/payload-candidate
          persist-credentials: false

      - name: Run source-bound offline QA
        run: python -B qa/ssh-workspace-316/run.py

      - name: Upload accumulated evidence
        if: always() && env.QA_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: ssh-workspace-316-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QA_DIR }}/evidence/
          if-no-files-found: error
          retention-days: 7

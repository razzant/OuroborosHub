name: Sync Joi Lab Mirror

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Owner Updates]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-main-catalog-and-mirror
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'razzant/OuroborosHub' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Resolve current main, never a PR or a possibly stale workflow_run head.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML
      - name: Generate the v1 catalog, publish it, then mirror the exact commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CATALOG_DEPLOY_KEY: ${{ secrets.CATALOG_DEPLOY_KEY }}
          MIRROR_PAT: ${{ secrets.JOILAB_HUB_MIRROR_PAT }}
        run: python -B scripts/sync_mirror.py
